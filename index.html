 for(const k of['face','faceLayer'])if(typeof d[k]!=='string'||d[k].length>90000||!/^data:image\/png;base64,[A-Za-z0-9+\/=]+$/.test(d[k]))d[k]=null;

 try{const b=+localStorage.getItem('d20k');if(b>1)return sanitize({best:b})}catch(e){}return defSave()}
function persist(){try{const raw=JSON.stringify({h:sum(JSON.stringify(save)),d:save}),old=localStorage.getItem(SAVE_KEY);if(old)localStorage.setItem(BAK_KEY,old);localStorage.setItem(SAVE_KEY,raw);storageOK=true}catch(e){storageOK=false}}

function makeLevel(){
 const L=level;theme=TH[(L-1)%TH.length];seed=L*9973+11;world=2300+Math.min(L,60)*16;
 plats=[{x:0,y:470,w:390,h:70,x0:0,amp:0}];spikes=[];coins=[];picks=[];foes=[];shots=[];parts=[];texts=[];boss=null;
 let x=450,py=420;
 while(x<world-520){
  const w=Math.max(100,Math.round(135+R()*70-L*.5)),y=Math.max(300,Math.min(440,py+(R()-.5)*110));py=y;
  const q={x,y,w,h:22,x0:x,amp:0,sp:0};
  if(L>=8&&R()<.28){q.amp=20+R()*12;q.sp=.02+R()*.015;q.moving=1;q.x0=x+q.amp}

 const st=plats.filter(q=>!q.moving&&q.w>=100&&q.x>420&&q.x<world-400),na=Math.min(6,2+(L/15|0));
 for(let i=0;i<na&&st.length;i++){const q=st[Math.floor((i+.5)*st.length/na)];picks.push({x:q.x+q.w/2,y:q.y-30,t:'a'})}
 if(L%4===0&&st.length){const q=st[st.length>>1];picks.push({x:q.x+q.w/2+30,y:q.y-30,t:'h'})}
 if(TH.indexOf(theme)===6)for(let i=0;i<3&&st.length;i++){const q=st[Math.floor((i+1.5)*st.length/4)];picks.push({x:q.x+q.w/2-20,y:q.y-34,t:'t',id:(i+L)%4})}

 for(let i=0;i<n&&fl.length;i++){const q=fl[Math.floor((i+.5)*fl.length/n)%fl.length],fly=L>=6&&i%3===2;
  foes.push({x:q.x+20+R()*20,y:fly?q.y-110:q.y-32,by:q.y-110,w:30,h:32,a:fly?q.x-70:q.x+4,b:fly?q.x+q.w+40:q.x+q.w-34,hp,mh:hp,v:sp*(i%2?-1:1),alive:true,fly,flash:0,stun:0})}

 Object.assign(p,{x:55,y:428,vx:0,vy:0,ground:false,inv:45,sx:55,sy:470,jumps:0,coy:0,on:null});jumpDown=false;buf=0;energy=100;cam=0;banner=170;sync()}

function update(){

$('#start').onclick=()=>mode==='pause'?setPause(false):begin(1);$('#cont').onclick=()=>save.run?begin(save.run.level,save.run):begin(best);

addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();if(e.repeat)return;keys[e.code]=true;

addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;jumpDown=false;setPause(true)});document.addEventListener('visibilitychange',()=>{if(document.hidden){setPause(true);persist()}});addEventListener('pagehide',persist);
document.querySelectorAll('.touch').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[k]=false)});

const fe=$('#faceEd'),fc=$('#faceCv'),fg=fc.getContext('2d');let fcol='#2b2b2b',fsize=5,ferase=false,fdraw=false,fprev=null;
const fpos=e=>{const r=fc.getBoundingClientRect();return[(e.clientX-r.left)*128/r.width,(e.clientY-r.top)*128/r.height]};
function stroke(a,b){fg.globalCompositeOperation=ferase?'destination-out':'source-over';fg.strokeStyle=fcol;fg.lineWidth=fsize;fg.lineCap=fg.lineJoin='round';fg.beginPath();fg.moveTo(a[0],a[1]);fg.lineTo(b[0]+.01,b[1]);fg.stroke()}
fc.addEventListener('pointerdown',e=>{e.preventDefault();fc.setPointerCapture(e.pointerId);fdraw=true;fprev=fpos(e);stroke(fprev,fprev)});
fc.addEventListener('pointermove',e=>{if(!fdraw)return;const n=fpos(e);stroke(fprev,n);fprev=n});
for(const ev of['pointerup','pointercancel'])fc.addEventListener(ev,()=>fdraw=false);
['#2b2b2b','#ffffff','#e53935','#fb8c00','#fdd835','#43a047','#1e88e5','#8e24aa','#8d5a3b'].forEach(c=>{const b=document.createElement('button');b.className='sw';b.style.background=c;b.title=c;b.onclick=()=>{fcol=c;ferase=false};$('#swatches').appendChild(b)});

loadFace();$('#hero').value=save.hero;$('#useFace').checked=!!(save.useFace&&save.face);$('#muteBtn').textContent=muted?'🔇':'🔊';showOv('Dastan2026','100 деңгей, 7 карта, қорқынышты құбыжықтар. Қазақстанның қазыналарын тап!','menu');
